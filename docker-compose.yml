services:
  app:
    build: .
    command: web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prospec:${POSTGRES_PASSWORD}@postgres:5432/prospec
      REDIS_URL: redis://redis:6379
      WAHA_URL: http://waha:3000
      PUBLIC_URL: http://app:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build: .
    command: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prospec:${POSTGRES_PASSWORD}@postgres:5432/prospec
      REDIS_URL: redis://redis:6379
      WAHA_URL: http://waha:3000
      PUBLIC_URL: http://app:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prospec
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospec"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-WEBJS}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - wahasessions:/app/.sessions
    # sem portas expostas: só o app e o worker falam com o WAHA pela rede interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  wahasessions:
  caddydata:
